server:
  port: ${SPRING_SERVER_PORT:7800}

spring:
  application:
    name: plant-backend-spring
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:512MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:512MB}

plant:
  storage:
    backend-root: ${PLANT_BACKEND_ROOT:../plantbackend}
    auth-db-path: ${AUTH_DB_PATH:../plantbackend/plant_auth.db}
    models-directory: ${MODELS_DIR:../plantbackend/models}
    annotation-datasets-root: ${ANNOTATION_DATASETS_ROOT:../plantbackend/annotation_datasets}
    augment-script-path: ${AUGMENT_SCRIPT_PATH:../plantbackend/augment_yolo.py}
    augmentation-algorithms-directory: ${AUGMENTATION_ALGORITHMS_DIR:../plantbackend/augmentation_algorithms}
    active-augmentation-script-record: ${ACTIVE_AUGMENTATION_SCRIPT_RECORD:../plantbackend/active_augmentation_script.txt}
    default-annotation-dataset-name: ${DEFAULT_ANNOTATION_DATASET_NAME:default}
    auth-session-hours: ${AUTH_SESSION_HOURS:168}
    max-upload-bytes: ${MAX_UPLOAD_BYTES:536870912}
  legacy:
    base-url: ${LEGACY_BACKEND_BASE_URL:http://127.0.0.1:${LEGACY_BACKEND_PORT:7801}}
    auto-start: ${LEGACY_BACKEND_AUTO_START:true}
    host: ${LEGACY_BACKEND_HOST:127.0.0.1}
    port: ${LEGACY_BACKEND_PORT:7801}
    working-directory: ${LEGACY_BACKEND_WORKING_DIRECTORY:../plantbackend}
    python-path: ${LEGACY_BACKEND_PYTHON_PATH:}
    start-timeout-seconds: ${LEGACY_BACKEND_START_TIMEOUT_SECONDS:120}
    connect-timeout-seconds: ${LEGACY_BACKEND_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${LEGACY_BACKEND_READ_TIMEOUT_SECONDS:600}
